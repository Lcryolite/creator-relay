<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Creator Relay</title>
    <style>
      body { max-width: 760px; margin: 3rem auto; font: 16px/1.5 system-ui; padding: 0 1rem; color: #172033; }
      textarea, input { box-sizing: border-box; width: 100%; margin: .3rem 0 1rem; padding: .7rem; font: inherit; }
      textarea { min-height: 10rem; } button { padding: .7rem 1rem; font: inherit; }
      pre { white-space: pre-wrap; background: #f4f6fa; padding: 1rem; border-radius: .5rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Creator Relay</h1>
      <p>Turn one creator brief into transparent cross-channel drafts. This loopback demo does not send email or claim a live Mind response.</p>
      <form id="brief">
        <label>Source material<textarea name="source" required minlength="40"></textarea></label>
        <label>Audience<input name="audience" required placeholder="Independent video creators"></label>
        <label>Goal<input name="goal" required placeholder="Invite discussion around the next episode"></label>
        <fieldset><legend>Channels</legend>
          <label><input type="checkbox" name="channels" value="YouTube" checked> YouTube</label>
          <label><input type="checkbox" name="channels" value="X"> X</label>
          <label><input type="checkbox" name="channels" value="Instagram"> Instagram</label>
        </fieldset>
        <button type="submit">Build local draft</button>
      </form>
      <pre id="result" aria-live="polite">No draft generated yet.</pre>
    </main>
    <script>
      document.querySelector('#brief').addEventListener('submit', async (event) => {
        event.preventDefault(); const form = new FormData(event.currentTarget);
        const response = await fetch('/api/brief', {method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({source: form.get('source'), audience: form.get('audience'), goal: form.get('goal'), channels: form.getAll('channels')})});
        document.querySelector('#result').textContent = JSON.stringify(await response.json(), null, 2);
      });
    </script>
  </body>
</html>
